name: Format

# Run by hand from the Actions tab to format the code with `dart format`
# and commit the result.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format and commit
        run: |
          flutter pub get
          (cd example && flutter pub get)
          dart format .
          if git diff --quiet; then
            echo "Everything is already formatted."
            exit 0
          fi
          git config user.name "Abdullah Ayyad"
          git config user.email "ab.ayyad@gmail.com"
          git commit -am "Format code with dart format"
          git push
