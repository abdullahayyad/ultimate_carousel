name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  latest:
    name: Latest stable Flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version

      - name: Install dependencies
        run: |
          flutter pub get
          cd example && flutter pub get

      - name: Check formatting
        id: format
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: |
          set +e
          flutter analyze > "$RUNNER_TEMP/analyze.txt" 2>&1
          status=$?
          cat "$RUNNER_TEMP/analyze.txt"
          if [ $status -ne 0 ]; then
            python3 .github/scripts/annotate.py analyze "$RUNNER_TEMP/analyze.txt"
          fi
          exit $status

      - name: Test
        if: success() || failure()
        run: |
          set +e
          flutter test --file-reporter "json:$RUNNER_TEMP/test-report.json"
          status=$?
          if [ $status -ne 0 ]; then
            python3 .github/scripts/annotate.py tests "$RUNNER_TEMP/test-report.json"
          fi
          exit $status

      - name: Check that the package can be published
        if: success() || failure()
        run: flutter pub publish --dry-run

      - name: Fail when the code is not formatted
        if: steps.format.outcome == 'failure'
        run: |
          echo "::error title=dart format::Some files are not formatted. Run dart format . or the Format workflow."
          exit 1

  oldest:
    name: Oldest supported Flutter (3.22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.22.x
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          cd example && flutter pub get

      - name: Analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos > "$RUNNER_TEMP/analyze.txt" 2>&1
          status=$?
          cat "$RUNNER_TEMP/analyze.txt"
          if [ $status -ne 0 ]; then
            python3 .github/scripts/annotate.py analyze "$RUNNER_TEMP/analyze.txt"
          fi
          exit $status

      - name: Test
        if: success() || failure()
        run: |
          set +e
          flutter test --file-reporter "json:$RUNNER_TEMP/test-report.json"
          status=$?
          if [ $status -ne 0 ]; then
            python3 .github/scripts/annotate.py tests "$RUNNER_TEMP/test-report.json"
          fi
          exit $status
